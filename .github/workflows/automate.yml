# /automate — a comment on a pull request in your APP repository records a test on a cloud device
# and opens it as a pull request in your TEST repository.
#
# This is a REUSABLE workflow: your repository calls it from a short file you own, and LIME improves
# it here without ever rewriting your files. See README.md for the caller and the inputs.
#
#   /automate 2                      record suggestion 2 from LIME's impact comment
#   /automate 1,3                    several suggestions (up to 5 tests per comment)
#   /automate 2 ios                  …on iOS, when the caller lists more than one platform
#   /automate open Cart and verify the total is shown
#   /automate                        several typed goals: one per line under a bare /automate
#   - log in and verify Home shows "Welcome"
#   - add a product and verify the cart badge shows 1
#
# Commas separate numbers only (a typed goal keeps its commas). LIME reads the command, and refuses
# one it will not run — more than 5 tests, a gone suggestion, a line that is not a goal — with a
# reply that says why, before anything is built or booked. The tests are recorded one after another
# and all land in ONE pull request in your test repository.
#
# How it flows: build the app from the PR head with YOUR build action → upload the build straight
# to the cloud provider (LIME never receives it) → LIME records the goal on a real device → LIME
# hands the recording to the test repository's own workflow (taqwright-automate.yml), which writes
# the test in your suite's conventions and has the Taqwright GitHub App open the pull request →
# this job waits for it and the App replies on your pull request with the link.
#
# YOUR BUILD lives in your repository, at a fixed path (GitHub does not allow `uses:` to take an
# input), and is checked out from the PR head:
#   .github/actions/lime-build-android/action.yml   (or lime-build-ios/, per platform)
#   .github/actions/lime-build/action.yml           (fallback, used when no per-platform one exists)
# It may contain any steps. It must leave one installable file (.apk / .ipa) at the `artifact-*` path.

name: lime-automate

on:
  workflow_call:
    inputs:
      project:
        description: The LIME project (must exist). Its bound test repository receives the test.
        type: string
        required: true
      platforms:
        description: Comma-separated platforms this app builds for; the first is the default.
        type: string
        default: android
      cloud-provider:
        description: lambdatest (TestMu AI) or browserstack.
        type: string
        default: lambdatest
      runner-android:
        description: JSON list of runner labels for Android, e.g. '["self-hosted","macOS","ARM64"]'.
        type: string
        default: '["ubuntu-latest"]'
      device-android:
        description: Exact provider device name.
        type: string
        default: Pixel 8
      os-android:
        description: Exact provider OS version.
        type: string
        default: '14'
      artifact-android:
        description: Path (from the repository root) of the .apk your build action leaves.
        type: string
        default: app/build/outputs/apk/debug/app-debug.apk
      runner-ios:
        description: JSON list of runner labels for iOS. A Mac is required to build iOS.
        type: string
        default: '["macos-latest"]'
      device-ios:
        description: Exact provider device name.
        type: string
        default: iPhone 15
      os-ios:
        description: Exact provider OS version.
        type: string
        default: '17'
      artifact-ios:
        description: Path (from the repository root) of the signed .ipa your build action leaves.
        type: string
        default: ''
      lime-cli-version:
        description: npm version of @taqwright/lime-cli. Never bare, so a stale copy on a self-hosted runner is never used.
        type: string
        default: latest
      allow-fork-prs:
        description: >
          Run /automate on pull requests from forks. Off by default: /automate builds and runs the
          pull request's code with your secrets, so on a fork that is a stranger's code. A
          maintainer can still allow one pull request by adding the label lime-allow-fork.
        type: boolean
        default: false
      timeout-minutes:
        type: number
        default: 45
    secrets:
      LIME_CI_TOKEN:
        required: true
      LT_USERNAME:
        required: false
      LT_ACCESS_KEY:
        required: false
      BROWSERSTACK_USERNAME:
        required: false
      BROWSERSTACK_ACCESS_KEY:
        required: false

jobs:
  # Is this a command, what is the goal, and which platform? Everything is gated on `ok`, so a
  # comment that merely mentions /automate exits in seconds without reacting or spending.
  parse:
    # Only on pull requests, only for /automate, only from someone who can already write to this
    # repository (this builds and RUNS code from the PR head), and never for a bot's own comment.
    if: >
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '/automate') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ${{ fromJSON(inputs.runner-android) }}
    outputs:
      ok: ${{ steps.goal.outputs.ok }}
      tests: ${{ steps.goal.outputs.tests }}
      platform: ${{ steps.goal.outputs.platform }}
      minutes: ${{ steps.goal.outputs.minutes }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse the command
        id: goal
        env:
          GH_TOKEN: ${{ github.token }}
          LIME_CI_TOKEN: ${{ secrets.LIME_CI_TOKEN }}
          COMMENT: ${{ github.event.comment.body }}
          PR: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          PLATFORMS: ${{ inputs.platforms }}
          ALLOW_FORKS: ${{ inputs.allow-fork-prs }}
          TIMEOUT: ${{ inputs.timeout-minutes }}
          LIME_CLI: '@taqwright/lime-cli@${{ inputs.lime-cli-version }}'
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The first NON-BLANK line must open with /automate (a comment box adds a leading CRLF
          # when you press Enter first); "/automated" must not match.
          FIRST=$(printf '%s' "$COMMENT" | tr -d '\r' | sed -e 's/^[[:space:]]*//' | grep -vE '^$' | head -1 || true)
          case "$FIRST" in
            /automate|/automate\ *) GOAL=$(printf '%s' "${FIRST#/automate}" | sed -e 's/^[[:space:]]*//') ;;
            *) echo "Not an /automate command — ignoring this comment."
               echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # Never a fork's pull request unless the caller allows forks or a maintainer labelled this
          # one: what runs next is the pull request's own code (its build action included), with
          # this repository's secrets.
          IS_FORK=$(gh pr view "$PR" -R "$REPO" --json isCrossRepository -q .isCrossRepository)
          if [ "$IS_FORK" = "true" ] && [ "$ALLOW_FORKS" != "true" ]; then
            LABELLED=$(gh pr view "$PR" -R "$REPO" --json labels -q '[.labels[].name] | index("lime-allow-fork") != null')
            if [ "$LABELLED" != "true" ]; then
              echo "::warning::This pull request comes from a fork, so /automate would run a stranger's code with this repository's secrets. A maintainer can allow it by adding the label lime-allow-fork, then commenting again."
              echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          # WHAT TO RECORD, read by LIME: the same reading its instant acknowledgement uses. Each
          # number's goal comes from LIME's own analysis of this pull request, never from the
          # comment: a commenter picks a number, not what runs. Exit 3 is a command LIME refused
          # (too many tests, a gone suggestion, one behind a feature flag, a line that is not a
          # goal) — it has replied on the pull request saying why, so this stops quietly.
          set +e
          PLAN="$(npx -y "$LIME_CLI" pr plan --platforms "$PLATFORMS")"
          CODE=$?
          set -e
          if [ "$CODE" = 3 ]; then
            echo "LIME refused this command and replied on the pull request."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # LIME COULD NOT BE ASKED, even after lime-cli waited out a restart (~2 minutes): this
          # command did not run. The reply goes through LIME too, so it may not arrive — and the
          # job used to end GREEN then, with nothing on the pull request to say so (a comment made
          # during a deploy, demo-app#27). It fails red now, with the reason on the run.
          if [ "$CODE" != 0 ]; then
            npx -y "$LIME_CLI" pr reply --kind failed --run-url "$RUN" || true
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error title=/automate did not run::LIME could not be reached (lime-cli pr plan exited $CODE after retrying for about 2 minutes — LIME may have been restarting). Nothing was recorded. Comment the same /automate again." >&2
            exit 1
          fi
          TESTS="$(printf '%s' "$PLAN" | jq -c '.tests')"
          # A bare /automate falls back to the pull request's own title and opening lines.
          if [ "$(printf '%s' "$TESTS" | jq 'length')" = 0 ]; then
            GOAL="$(gh pr view "$PR" -R "$REPO" --json title,body \
              --jq '.title + ". " + (.body // "" | split("\n") | .[0:5] | join(" "))')"
            TESTS="$(jq -cn --arg g "$GOAL" '[{goal: $g}]')"
          fi
          # The platform: the one the command named, else the caller's first.
          PLATFORM="$(printf '%s' "$PLAN" | jq -r '.platform // ""')"
          [ -n "$PLATFORM" ] || PLATFORM=$(printf '%s' "$PLATFORMS" | tr ',' ' ' | awk '{print $1}')
          case "$PLATFORM" in android|ios) ;; *) echo "::error::platforms must be android and/or ios." >&2; exit 1 ;; esac
          # Room for every test: each is recorded, handed over and written one after another,
          # about 15 minutes apiece. The caller's timeout is the floor.
          COUNT="$(printf '%s' "$TESTS" | jq 'length')"
          MINUTES=$(( 30 + 15 * COUNT ))
          [ "$MINUTES" -ge "$TIMEOUT" ] || MINUTES="$TIMEOUT"
          {
            echo "ok=true"
            echo "tests=$TESTS"
            echo "platform=$PLATFORM"
            echo "minutes=$MINUTES"
          } >> "$GITHUB_OUTPUT"
          printf '%s' "$TESTS" | jq -r --arg p "$PLATFORM" 'to_entries[] | "Test \(.key + 1) (\($p)): \(.value.goal)"'
      # The Taqwright GitHub App reacts and says what is being automated; LIME writes the words.
      - name: Acknowledge the command
        if: steps.goal.outputs.ok == 'true'
        env:
          LIME_CI_TOKEN: ${{ secrets.LIME_CI_TOKEN }}
          LIME_CLI: '@taqwright/lime-cli@${{ inputs.lime-cli-version }}'
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          # Through the environment, never pasted into the script: typed goals are text someone typed.
          TESTS: ${{ steps.goal.outputs.tests }}
        run: |
          npx -y "$LIME_CLI" pr reply --kind ack
          # The head this run builds, so the reply names it rather than the last analysed one.
          HEAD="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid 2>/dev/null || true)"
          printf '%s' "$TESTS" > "$RUNNER_TEMP/lime-tests.json"
          npx -y "$LIME_CLI" pr reply --kind started --tests-file "$RUNNER_TEMP/lime-tests.json" \
            --head "$HEAD" --run-url "$RUN"

  automate:
    needs: parse
    if: needs.parse.outputs.ok == 'true'
    # The platform's own machine: iOS needs a Mac, Android can run anywhere.
    runs-on: ${{ fromJSON(needs.parse.outputs.platform == 'ios' && inputs.runner-ios || inputs.runner-android) }}
    # LIME allows one recording per account at a time, so serialise. Never cancel-in-progress: a
    # cancelled job skips its teardown and leaks a cloud device.
    concurrency:
      group: lime-automate-${{ github.repository }}
      cancel-in-progress: false
    # The caller's timeout, raised to fit every test the command asked for (see the parse step).
    timeout-minutes: ${{ fromJSON(needs.parse.outputs.minutes) }}
    env:
      PLATFORM: ${{ needs.parse.outputs.platform }}
      DEVICE: ${{ needs.parse.outputs.platform == 'ios' && inputs.device-ios || inputs.device-android }}
      DEVICE_OS: ${{ needs.parse.outputs.platform == 'ios' && inputs.os-ios || inputs.os-android }}
      ARTIFACT: ${{ needs.parse.outputs.platform == 'ios' && inputs.artifact-ios || inputs.artifact-android }}
      CLOUD_PROVIDER: ${{ inputs.cloud-provider }}
      LIME_PROJECT: ${{ inputs.project }}
      LIME_CLI: '@taqwright/lime-cli@${{ inputs.lime-cli-version }}'
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # The default branch first: the build action that runs is the one on it — reviewed and
      # merged — never one a pull request rewrote. It is kept aside, the PR head is checked out
      # over it, and then it is put back.
      - name: Check out the default branch
        uses: actions/checkout@v4
      - name: Keep the default branch's build actions
        run: |
          mkdir -p "$RUNNER_TEMP/lime-build-actions"
          for d in .github/actions/lime-build .github/actions/lime-build-android .github/actions/lime-build-ios; do
            if [ -f "$d/action.yml" ]; then cp -R "$d" "$RUNNER_TEMP/lime-build-actions/"; echo "Using $d from the default branch."; fi
          done
      - name: Check out the app at the PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checkout ${{ github.event.issue.number }}
      # The default branch's build actions win. A pull request's own copy is used only where the
      # default branch has none — the pull request that adds the build action in the first place.
      # A branch made before the action existed then still builds.
      - name: Put the build actions in place
        run: |
          mkdir -p .github/actions
          for d in "$RUNNER_TEMP"/lime-build-actions/*; do
            [ -d "$d" ] || continue
            rm -rf ".github/actions/$(basename "$d")"
            cp -R "$d" .github/actions/
          done
          ls -d .github/actions/lime-build* 2>/dev/null || echo "No build action on the default branch or in this pull request."

      # Your build. Per-platform action first, the plain one as a fallback.
      - name: Build the app (your lime-build-${{ env.PLATFORM }} action)
        if: env.PLATFORM == 'android' && hashFiles('.github/actions/lime-build-android/action.yml') != ''
        uses: ./.github/actions/lime-build-android
      - name: Build the app (your lime-build-${{ env.PLATFORM }} action)
        if: env.PLATFORM == 'ios' && hashFiles('.github/actions/lime-build-ios/action.yml') != ''
        uses: ./.github/actions/lime-build-ios
      - name: Build the app (your lime-build action)
        if: hashFiles(format('.github/actions/lime-build-{0}/action.yml', env.PLATFORM)) == '' && hashFiles('.github/actions/lime-build/action.yml') != ''
        uses: ./.github/actions/lime-build
      - name: Check the build is there
        run: |
          if [ -z "$ARTIFACT" ]; then
            echo "::error::No artifact path for $PLATFORM. Set artifact-$PLATFORM in your caller workflow." >&2; exit 1
          fi
          if [ ! -f "$ARTIFACT" ]; then
            if [ ! -f ".github/actions/lime-build-$PLATFORM/action.yml" ] && [ ! -f ".github/actions/lime-build/action.yml" ]; then
              echo "::error::No build action. Add .github/actions/lime-build-$PLATFORM/action.yml (or .github/actions/lime-build/action.yml) to this repository — see https://github.com/Taqwright/lime-workflows#your-build-action" >&2
            else
              echo "::error::Your build action finished but $ARTIFACT does not exist. Fix artifact-$PLATFORM in the caller, or the build." >&2
            fi
            exit 1
          fi
          ls -l "$ARTIFACT"

      # The build goes STRAIGHT to the provider; LIME takes the id only.
      - name: Upload the build to the cloud provider
        id: app
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          NAME: ${{ github.event.repository.name }}-PR-${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ "$CLOUD_PROVIDER" = "lambdatest" ]; then
            ID=$(curl -sS -u "$LT_USERNAME:$LT_ACCESS_KEY" \
              -X POST https://manual-api.lambdatest.com/app/upload/realDevice \
              -F "appFile=@$ARTIFACT" -F "name=$NAME" | jq -er .app_id)
            echo "url=lt://$ID" >> "$GITHUB_OUTPUT"
          else
            URL=$(curl -sS -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
              -X POST https://api-cloud.browserstack.com/app-automate/upload \
              -F "file=@$ARTIFACT" | jq -er .app_url)
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install lime-cli
        run: npm install -g "$LIME_CLI"

      # EACH TEST IN TURN, on its own device session: record it (--keep-session holds the session,
      # because the recording lives on it), hand the recording to the test repository's
      # taqwright-automate.yml (LIME saves it off the session, never from this request), release
      # the device, and WAIT for the test pull request before the next hand-off. The wait is not
      # optional: the test repository runs one job and holds one more, and a third hand-off would
      # cancel the one waiting. Every test lands in the same test pull request.
      #
      # SEVERAL TESTS OPEN THAT PULL REQUEST ONCE, AT THE END. Each is handed over with --hold-pr,
      # so the test repository pushes it with no pull request open, and `pr open-held` has LIME's
      # App open it after the last. A test pushed onto an OPEN pull request with the test
      # repository's GITHUB_TOKEN raises a run GitHub holds until someone approves it; a push with
      # none open raises nothing, and the App's pull request runs without asking. One test opens
      # its pull request at once, as before. An older lime-cli or test-repo template never holds.
      #
      # A test that fails does not stop the others; each one's outcome is kept for the reply.
      - name: Record and hand over each test
        id: tests
        env:
          LIME_CI_TOKEN: ${{ secrets.LIME_CI_TOKEN }}
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          APP_URL: ${{ steps.app.outputs.url }}
          # Through the environment, never pasted into the script: typed goals are text someone typed.
          TESTS: ${{ needs.parse.outputs.tests }}
        run: |
          set -uo pipefail
          RESULTS="$RUNNER_TEMP/lime-results.json"
          echo '[]' > "$RESULTS"
          COUNT="$(printf '%s' "$TESTS" | jq 'length')"
          HOLD=""; [ "$COUNT" -gt 1 ] && HOLD=1
          HELD=0
          for i in $(seq 0 $(( COUNT - 1 ))); do
            ENTRY="$(printf '%s' "$TESTS" | jq -c ".[$i]")"
            GOAL="$(printf '%s' "$ENTRY" | jq -r '.goal')"
            echo "::group::Test $(( i + 1 )) of $COUNT: $GOAL"
            OUTCOME=failed; JOURNEY=""; STUCK_ID=""
            # `|| RC=$?`, never a bare command then `RC=$?`: GitHub runs this step with `bash -e`, which
            # ends the whole step on the first failing command — a recording that could not even
            # connect stopped every later test and the reply (demo-app#29). `set -uo pipefail` above
            # does not turn -e off; a command on the left of || is exempt from it.
            RC=0
            lime-cli --goal "$GOAL" \
                 --cloud "$CLOUD_PROVIDER" --device "$DEVICE" --platform "$PLATFORM" --os "$DEVICE_OS" \
                 --app-url "$APP_URL" --project "$LIME_PROJECT" --keep-session || RC=$?
            if [ "$RC" = 4 ]; then
              # LOST CONTACT WITH LIME mid-recording (lime-cli exit 4, after retrying): nothing got
              # stuck, so there is no stuck record to ask for. The reply says "interrupted" and how
              # to retry, not "the recording got stuck" (demo-app#27, a Cloudflare 1001 page).
              OUTCOME=interrupted
            elif [ "$RC" = 0 ]; then
              OUT="$(lime-cli pr automate --project "$LIME_PROJECT" ${HOLD:+--hold-pr})" && echo "$OUT"
              JOURNEY="$(printf '%s' "${OUT:-}" | jq -r '.journeyId // empty' 2>/dev/null || true)"
              # Recorded, but not handed to the test repository (lime-cli already retried a
              # network failure): nothing verified it, so the reply must not say it failed
              # verification. It says how to retry instead.
              [ -z "$JOURNEY" ] && OUTCOME=not-handed
            else
              OUTCOME=stuck
              # Why it stopped, read by LIME off the session this job still holds, and the
              # screen it stopped on committed to the test repository. Never fails the job;
              # an older lime-cli prints no record id and the reply simply says less.
              STUCK="$(lime-cli pr stuck --project "$LIME_PROJECT" || true)" && echo "$STUCK"
              STUCK_ID="$(printf '%s' "${STUCK:-}" | jq -r '.stuckId // empty' 2>/dev/null || true)"
            fi
            # Always: the device is billing until it is released.
            lime-cli disconnect || true
            if [ -n "$JOURNEY" ]; then
              WAITED="$(lime-cli pr wait --journey "$JOURNEY" --timeout 1200)" && echo "$WAITED"
              URL="$(printf '%s' "${WAITED:-}" | jq -r '.prUrl // empty' 2>/dev/null || true)"
              if [ -n "$URL" ]; then
                OUTCOME=added
                echo "url=$URL" >> "$GITHUB_OUTPUT"
              elif [ "$(printf '%s' "${WAITED:-}" | jq -r '.covered // false' 2>/dev/null)" = "true" ]; then
                OUTCOME=passed
              elif [ "$(printf '%s' "${WAITED:-}" | jq -r '.held // false' 2>/dev/null)" = "true" ]; then
                # Pushed; its pull request opens after the last test (below).
                OUTCOME=added
                HELD=1
              fi
            fi
            jq --argjson e "$ENTRY" --arg o "$OUTCOME" --arg j "$JOURNEY" --arg k "$STUCK_ID" \
              '. + [($e | if .n != null then {n} else {goal} end) + {outcome: $o}
                    + (if $j == "" then {} else {journeyId: ($j | tonumber)} end)
                    + (if ($k | test("^[0-9]+$")) then {stuckId: ($k | tonumber)} else {} end)]' \
              "$RESULTS" > "$RESULTS.tmp" && mv "$RESULTS.tmp" "$RESULTS"
            echo "Test $(( i + 1 )): $OUTCOME"
            echo "::endgroup::"
          done

          # The held pull request, opened once by LIME's App: its run tests every test above and
          # needs nobody to approve it. The tests are pushed whatever happens here.
          if [ "$HELD" = 1 ]; then
            if OPENED="$(lime-cli pr open-held)"; then
              echo "$OPENED"
              URL="$(printf '%s' "$OPENED" | jq -r '.url // empty' 2>/dev/null || true)"
              [ -n "$URL" ] && echo "url=$URL" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::LIME could not open the test pull request. The tests are pushed to the test repository's taqwright/pr-* branch for this pull request; open one from it."
            fi
          fi

      # Always: a session left open by a run that died mid-test is still billing.
      - name: Release the device
        if: always()
        env:
          LIME_CI_TOKEN: ${{ secrets.LIME_CI_TOKEN }}
        run: lime-cli disconnect || true

      # The result, posted by the Taqwright GitHub App in ONE comment: each test added (in the test
      # PR, whose own run verifies it), already covered, stuck while recording, or failed — and,
      # when the job broke before any test finished, that it failed.
      - name: Report back on the pull request
        if: always()
        env:
          LIME_CI_TOKEN: ${{ secrets.LIME_CI_TOKEN }}
          TEST_PR: ${{ steps.tests.outputs.url }}
        run: |
          RESULTS="$RUNNER_TEMP/lime-results.json"
          if [ -f "$RESULTS" ] && [ "$(jq 'length' "$RESULTS")" != 0 ]; then
            npx -y "$LIME_CLI" pr reply --kind outcome --tests-file "$RESULTS" \
              ${TEST_PR:+--test-pr-url "$TEST_PR"} --run-url "$RUN"
          else
            npx -y "$LIME_CLI" pr reply --kind failed --run-url "$RUN"
          fi
